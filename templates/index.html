<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Explorer</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f5f5f5;
        }

        main {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        #searchInput,
        #categoryFilter,
        #sortSelect {
            padding: 12px;
            margin: 10px 5px;
            font-size: 16px;
        }

        #searchInput {
            width: 300px;
        }

        #products {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;
            margin-top: 30px;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        .product-card h3 {
            font-size: 18px;
        }

        .price {
            font-weight: bold;
            font-size: 20px;
        }

        .product-card button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #error {
            text-align: center;
            padding: 20px;
        }

        .hidden {
            display: none;
        }

        .no-products {
            text-align: center;
            font-size: 20px;
        }

    </style>

</head>


<body>

    <main>

        <h1>Product Explorer</h1>


        <!-- Search -->

        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
        >


        <!-- Category -->

        <select id="categoryFilter">

            <option value="all">
                All Categories
            </option>

        </select>


        <!-- Sort -->

        <select id="sortSelect">

            <option value="default">
                Default
            </option>

            <option value="low-high">
                Price: Low to High
            </option>

            <option value="high-low">
                Price: High to Low
            </option>

        </select>


        <!-- Loading -->

        <p id="loading">
            Loading products...
        </p>


        <!-- Error -->

        <div id="error" class="hidden">

            <p>
                Unable to load products.
            </p>

            <p>
                Please try again.
            </p>

            <button id="retryButton">
                Try Again
            </button>

        </div>


        <!-- Products -->

        <div id="products"></div>


        <!-- Total -->

        <h2 id="total">
            Total: $0.00
        </h2>

    </main>


    <script
        src="{{ url_for('static', filename='app.js') }}"
    ></script>

</body>

</html>
